<svg viewBox="0 0 320 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Oasis Curator 绿洲馆长">
  <title>Oasis Curator · 竖排完整版</title>
  <desc>Logo + 中英双语 + Slogan 的竖排完整版，用于名片、海报、PPT 封面等。</desc>

  <!-- ===== Logo 部分 ===== -->
  <g transform="translate(40, 10)">
    <!-- 圆环 -->
    <path d="M 43 110 A 90 90 0 1 1 197 110"
          fill="none" stroke="#1A4D3E" stroke-width="7" stroke-linecap="round"/>
    <circle cx="120" cy="40" r="4" fill="#C9A84C"/>
    <!-- 典籍 -->
    <path d="M 55 183 L 120 168 L 120 193 L 55 203 Z" fill="#1A4D3E"/>
    <path d="M 120 168 L 185 183 L 185 203 L 120 193 Z" fill="#C9A84C"/>
    <line x1="66" y1="188" x2="115" y2="176" stroke="#F5F0E8" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
    <line x1="66" y1="195" x2="115" y2="183" stroke="#F5F0E8" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
    <line x1="125" y1="176" x2="174" y2="188" stroke="#1A4D3E" stroke-width="1.3" stroke-linecap="round" opacity="0.4"/>
    <line x1="125" y1="183" x2="174" y2="195" stroke="#1A4D3E" stroke-width="1.3" stroke-linecap="round" opacity="0.4"/>
    <!-- 手与页面 -->
    <path d="M 120 168 L 120 115" stroke="#1A4D3E" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="120" cy="108" rx="17" ry="11" fill="#1A4D3E"/>
    <rect x="98" y="78" width="44" height="30" rx="2.5" fill="#F5F0E8" stroke="#1A4D3E" stroke-width="2.5"/>
    <line x1="105" y1="86" x2="135" y2="86" stroke="#C9A84C" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="105" y1="92" x2="128" y2="92" stroke="#C9A84C" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="105" y1="98" x2="135" y2="98" stroke="#C9A84C" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="105" y1="104" x2="120" y2="104" stroke="#C9A84C" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- ===== 分隔线（金色细横线 + ✦ 装饰） ===== -->
  <g transform="translate(160, 260)">
    <line x1="-60" y1="0" x2="-12" y2="0" stroke="#C9A84C" stroke-width="1.2" opacity="0.6"/>
    <line x1="12" y1="0" x2="60" y2="0" stroke="#C9A84C" stroke-width="1.2" opacity="0.6"/>
    <text x="0" y="4" text-anchor="middle"
          font-family="serif" font-size="12" fill="#C9A84C">✦</text>
  </g>

  <!-- ===== 文字部分 ===== -->
  <g text-anchor="middle">
    <!-- 英文主标 -->
    <text x="160" y="300"
          font-family="'Playfair Display', 'Times New Roman', 'Source Han Serif SC', serif"
          font-size="36"
          font-weight="700"
          fill="#1A4D3E"
          letter-spacing="2">Oasis Curator</text>

    <!-- 中文名 -->
    <text x="160" y="340"
          font-family="'Source Han Serif SC', 'Noto Serif CJK SC', 'STSong', serif"
          font-size="20"
          font-weight="500"
          fill="#1A4D3E"
          letter-spacing="6">绿 洲 馆 长</text>

    <!-- Slogan -->
    <text x="160" y="365"
          font-family="'Inter', 'Source Han Sans SC', sans-serif"
          font-size="10"
          font-weight="400"
          fill="#8C8C8C"
          letter-spacing="1.5">KNOWLEDGE PRESERVED · CONTEXT CURATED · WISDOM GUIDED</text>
  </g>
</svg>
