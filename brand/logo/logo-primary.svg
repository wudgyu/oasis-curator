<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Oasis Curator Logo">
  <title>Oasis Curator · 绿洲馆长</title>
  <desc>主 Logo：半开放圆环（绿洲守护边界）内含典籍、托书之手与被托起的页面。</desc>

  <!-- ===== 外层：半开放圆环（顶部断开 = 门） ===== -->
  <!-- 圆心 (120, 130)，半径 90，stroke-width 7 -->
  <!-- 顶部留 30° 缺口，从 -15° 到 +15°（gap at top） -->
  <path d="M 43 110 A 90 90 0 1 1 197 110"
        fill="none"
        stroke="#1A4D3E"
        stroke-width="7"
        stroke-linecap="round"/>

  <!-- 圆环缺口处的「门」标记：暖金小圆点 -->
  <circle cx="120" cy="40" r="4" fill="#C9A84C"/>

  <!-- ===== 底部：微微敞开的典籍（透视 V 形） ===== -->
  <!-- 典籍底部投影（极轻） -->
  <ellipse cx="120" cy="200" rx="72" ry="4" fill="#1A4D3E" opacity="0.12"/>

  <!-- 左页：墨绿 -->
  <path d="M 55 183 L 120 168 L 120 193 L 55 203 Z" fill="#1A4D3E"/>

  <!-- 右页：暖金（与被托起的页面呼应，形成视觉焦点） -->
  <path d="M 120 168 L 185 183 L 185 203 L 120 193 Z" fill="#C9A84C"/>

  <!-- 左页书页线条（象牙白，极轻） -->
  <line x1="66" y1="188" x2="115" y2="176" stroke="#F5F0E8" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <line x1="66" y1="195" x2="115" y2="183" stroke="#F5F0E8" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>

  <!-- 右页书页线条（墨绿，极轻） -->
  <line x1="125" y1="176" x2="174" y2="188" stroke="#1A4D3E" stroke-width="1.3" stroke-linecap="round" opacity="0.4"/>
  <line x1="125" y1="183" x2="174" y2="195" stroke="#1A4D3E" stroke-width="1.3" stroke-linecap="round" opacity="0.4"/>

  <!-- ===== 中部：托书之手（介于「托举」与「翻阅」之间） ===== -->
  <!-- 前臂从典籍脊背处延伸上来 -->
  <path d="M 120 168 L 120 115"
        stroke="#1A4D3E"
        stroke-width="10"
        stroke-linecap="round"/>

  <!-- 手掌（简化椭圆，承载感） -->
  <ellipse cx="120" cy="108" rx="17" ry="11" fill="#1A4D3E"/>

  <!-- 手指轻托：两个细微的弧线，体现"托"而非"握" -->
  <path d="M 103 105 Q 103 113 108 116"
        fill="none" stroke="#1A4D3E" stroke-width="3" stroke-linecap="round"/>
  <path d="M 137 105 Q 137 113 132 116"
        fill="none" stroke="#1A4D3E" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== 顶部：被托起的页面（策展的核心：被精选的知识） ===== -->
  <!-- 页面主体：象牙白 -->
  <rect x="98" y="78" width="44" height="30" rx="2.5"
        fill="#F5F0E8"
        stroke="#1A4D3E"
        stroke-width="2.5"/>

  <!-- 页面上方的「光晕」线：暖金点缀，象征「智慧之光」 -->
  <line x1="105" y1="86" x2="135" y2="86" stroke="#C9A84C" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="105" y1="92" x2="128" y2="92" stroke="#C9A84C" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="105" y1="98" x2="135" y2="98" stroke="#C9A84C" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="105" y1="104" x2="120" y2="104" stroke="#C9A84C" stroke-width="1.8" stroke-linecap="round"/>
</svg>
