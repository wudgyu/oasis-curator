<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Oasis Curator">
  <title>Oasis Curator · 横排版</title>
  <desc>主 Logo + 中英文字水平排版，用于网站头部、文档封面、横幅等。</desc>

  <!-- ===== Logo 部分 ===== -->
  <g transform="translate(0, -20)">
    <!-- 圆环 -->
    <path d="M 43 110 A 90 90 0 1 1 197 110"
          fill="none" stroke="#1A4D3E" stroke-width="7" stroke-linecap="round"/>
    <!-- 门标 -->
    <circle cx="120" cy="40" r="4" fill="#C9A84C"/>
    <!-- 典籍 -->
    <path d="M 55 183 L 120 168 L 120 193 L 55 203 Z" fill="#1A4D3E"/>
    <path d="M 120 168 L 185 183 L 185 203 L 120 193 Z" fill="#C9A84C"/>
    <!-- 手臂与手 -->
    <path d="M 120 168 L 120 115" stroke="#1A4D3E" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="120" cy="108" rx="17" ry="11" fill="#1A4D3E"/>
    <!-- 页面 -->
    <rect x="98" y="78" width="44" height="30" rx="2.5" fill="#F5F0E8" stroke="#1A4D3E" stroke-width="2.5"/>
    <line x1="105" y1="86" x2="135" y2="86" stroke="#C9A84C" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="105" y1="92" x2="128" y2="92" stroke="#C9A84C" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="105" y1="98" x2="135" y2="98" stroke="#C9A84C" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="105" y1="104" x2="120" y2="104" stroke="#C9A84C" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- ===== 分隔线（细金线） ===== -->
  <line x1="240" y1="40" x2="240" y2="160" stroke="#C9A84C" stroke-width="1.5" opacity="0.6"/>

  <!-- ===== 文字部分 ===== -->
  <g transform="translate(270, 0)">
    <!-- 英文主标（衬线，呼应「典籍」意象） -->
    <text x="0" y="92"
          font-family="'Playfair Display', 'Times New Roman', 'Source Han Serif SC', serif"
          font-size="52"
          font-weight="700"
          fill="#1A4D3E"
          letter-spacing="1">Oasis</text>
    <text x="0" y="142"
          font-family="'Inter', 'Helvetica Neue', 'Source Han Sans SC', sans-serif"
          font-size="36"
          font-weight="500"
          fill="#1A4D3E"
          letter-spacing="3">CURATOR</text>

    <!-- 中文名（思源宋体，典雅） -->
    <text x="285" y="125"
          font-family="'Source Han Serif SC', 'Noto Serif CJK SC', 'STSong', serif"
          font-size="32"
          font-weight="600"
          fill="#1A4D3E">绿洲馆长</text>

    <!-- Slogan（细体小字） -->
    <text x="0" y="172"
          font-family="'Inter', 'Source Han Sans SC', sans-serif"
          font-size="13"
          font-weight="400"
          fill="#8C8C8C"
          letter-spacing="1.5">Knowledge Preserved · Context Curated · Wisdom Guided</text>
  </g>
</svg>
