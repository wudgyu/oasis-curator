<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Oasis Curator Monochrome">
  <title>Oasis Curator · 单色版</title>
  <desc>仅使用墨绿主色的单色版，用于单色印刷、雕刻、压印等场景。</desc>

  <!-- 圆环（实心） -->
  <path d="M 43 110 A 90 90 0 1 1 197 110"
        fill="none"
        stroke="#1A4D3E"
        stroke-width="9"
        stroke-linecap="round"/>

  <!-- 门标（实心点） -->
  <circle cx="120" cy="40" r="5" fill="#1A4D3E"/>

  <!-- 典籍 -->
  <path d="M 55 183 L 120 168 L 120 193 L 55 203 Z" fill="#1A4D3E"/>
  <path d="M 120 168 L 185 183 L 185 203 L 120 193 Z" fill="#1A4D3E" opacity="0.75"/>

  <!-- 左页书页线条（象牙白镂空） -->
  <line x1="66" y1="188" x2="115" y2="176" stroke="#F5F0E8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="66" y1="195" x2="115" y2="183" stroke="#F5F0E8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 右页书页线条（象牙白镂空，浅一些以区分左右） -->
  <line x1="125" y1="176" x2="174" y2="188" stroke="#F5F0E8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="125" y1="183" x2="174" y2="195" stroke="#F5F0E8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- 手 -->
  <path d="M 120 168 L 120 115" stroke="#1A4D3E" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="120" cy="108" rx="17" ry="11" fill="#1A4D3E"/>
  <path d="M 103 105 Q 103 113 108 116" fill="none" stroke="#1A4D3E" stroke-width="3" stroke-linecap="round"/>
  <path d="M 137 105 Q 137 113 132 116" fill="none" stroke="#1A4D3E" stroke-width="3" stroke-linecap="round"/>

  <!-- 页面（用描边而非填充，与彩色版形成视觉差异） -->
  <rect x="98" y="78" width="44" height="30" rx="2.5"
        fill="none"
        stroke="#1A4D3E"
        stroke-width="2.5"/>

  <!-- 页面上文字线（用深色横线代表） -->
  <line x1="105" y1="86" x2="135" y2="86" stroke="#1A4D3E" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="105" y1="92" x2="128" y2="92" stroke="#1A4D3E" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="105" y1="98" x2="135" y2="98" stroke="#1A4D3E" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="105" y1="104" x2="120" y2="104" stroke="#1A4D3E" stroke-width="1.8" stroke-linecap="round"/>
</svg>
